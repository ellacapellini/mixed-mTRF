[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-trf"
version = "0.1.0"
description = "Mixed (hierarchical) temporal-response-function models for surprisal-modulated neural responses"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
bayes = ["pymc>=5", "arviz", "pytensor"]
dev = ["pytest"]

[project.scripts]
mixed-trf = "mixed_trf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
